name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @textrpg/content --filter @textrpg/engine --filter @textrpg/web test
      - name: Balance report
        run: pnpm simulate 60

  integration:
    name: Server + end-to-end (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: textrpg
          POSTGRES_PASSWORD: textrpg
          POSTGRES_DB: textrpg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U textrpg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://textrpg:textrpg@localhost:5432/textrpg_test
      TEST_DATABASE_URL: postgres://textrpg:textrpg@localhost:5432/textrpg_test
      E2E_DATABASE_URL: postgres://textrpg:textrpg@localhost:5432/textrpg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @textrpg/server test
      - run: pnpm build
      - run: pnpm --filter @textrpg/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  legacy-python:
    name: Legacy Python v0.2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
